[project]
name = "mymovie"
version = "2.0.0"
description = "Pick a well-rated movie together: TMDB catalog pipeline + Claude vibes + couple match web app"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=2.6",
    "httpx>=0.27",
    "pydantic>=2.8",
]

[project.scripts]
mymovie = "mymovie.cli:main"

[dependency-groups]
dev = [
    "jupyter>=1.1",
    "pytest>=8",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mymovie"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src"]
extend-exclude = ["*.ipynb"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
