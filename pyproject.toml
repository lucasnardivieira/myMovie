[project]
name = "mymovie"
version = "0.1.0"
description = "Genre-based movie recommender over the TMDB dataset, ranked by IMDb's weighted rating"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "kagglehub>=0.3",
    "pandas>=2.2",
]

[dependency-groups]
dev = [
    "jupyter>=1.1",
    "ruff>=0.6",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["*.ipynb"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
